services:
  traefik:
    image: traefik:v3.6.1
    restart: unless-stopped
    container_name: tr
    environment:
      - "DOCKER_API_VERSION=1.45"
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # HTTP -> HTTPS редирект на уровне entrypoint
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      # Let's Encrypt через HTTP-01 challenge
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "traefik_letsencrypt:/letsencrypt"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docservice
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    # порт наружу не публикуем — доступ только из docker-сети, снаружи не нужен

  app:
    build: .
    restart: unless-stopped
    container_name: app
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.docservice.rule=Host(`${SUBDOMAIN}.${DOMAIN}`)"
      - "traefik.http.routers.docservice.entrypoints=websecure"
      - "traefik.http.routers.docservice.tls.certresolver=letsencrypt"
      - "traefik.http.services.docservice.loadbalancer.server.port=8000"
    # порт 8000 наружу тоже не публикуем — весь внешний трафик идёт через traefik

volumes:
  pg_data:
  traefik_letsencrypt:
